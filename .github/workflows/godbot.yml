name: GodBot

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install
        run: pip install -r requirements.txt
      - name: Run GodBot
        run: python main.py
      - name: Commit
        run: |
          git config user.name "GodBot"
          git config user.email "bot@local"
          git add *.json -f
          git commit -m "Auto update" || exit 0
          git push || exit 0
